<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Калькулятор ціни</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card">
  <div class="lang-row">
    <div class="switch-wrap">
      <div class="theme-cell" id="themeCell">
        <div class="switch" id="themeSwitch" role="switch" tabindex="0" aria-checked="false" aria-label="Toggle dark theme" title="Toggle theme">
          <div class="knob"></div>
        </div>
        <div class="theme-label" id="themeLabel">Dark</div>
      </div>
    </div>
 
    <label for="langSelect" id="label-lang">Мова</label>
    <select id="langSelect" class="lang-select" aria-label="Language selector">
      <option value="uk">Українська</option>
      <option value="en">English</option>
      <option value="pl">Polski</option>
    </select>
  </div>
 
  <h1 id="title">Калькулятор ціни</h1>
  <p class="muted" id="intro">Введіть розміри в сантиметрах та фактичну вагу в кілограмах.</p>
 
  <div class="mode-row" id="modeRow">
    <div class="mode-block" role="group" aria-label="Тип відправки">
      <div class="mode-cell">
        <div class="mode-toggle" id="modeToggleWrap">
          <button id="btnParcel" class="mode-btn" aria-pressed="true" role="button">Посилка</button>
          <button id="btnDocs" class="mode-btn" aria-pressed="false" role="button">Документи</button>
        </div>
      </div>
    </div>
  </div>
 
  <div class="row">
    <div>
      <label for="length" id="label-length">Довжина (cm)</label>
      <input id="length" type="number" inputmode="decimal" step="any" min="0" placeholder="40">
    </div>
    <div>
      <label for="width" id="label-width">Ширина (cm)</label>
      <input id="width" type="number" inputmode="decimal" step="any" min="0" placeholder="30">
    </div>
    <div>
      <label for="height" id="label-height">Висота (cm)</label>
      <input id="height" type="number" inputmode="decimal" step="any" min="0" placeholder="20">
    </div>
  </div>
 
  <label for="weight" id="label-weight">Фактична вага (kg)</label>
  <input id="weight" type="number" inputmode="decimal" step="any" min="0" placeholder="2.5">
 
  <button class="pkg-btn" id="pkgBtn" type="button">
    <span id="pkgBtnIcon">＋</span>
    <span id="pkgBtnLabel">Додати пакування</span>
    <span class="pkg-clear" id="pkgClear" title="Видалити пакування" style="display:none">✕</span>
  </button>
 
  <label for="countryInput" id="label-country">Країна одержувача</label>
  <div class="autocomplete-wrapper">
    <input id="countryInput" class="country-input" type="search" autocomplete="off" placeholder="">
  </div>
 
  <label for="countrySelect" id="label-countrySelect">Країна одержувача</label>
  <select id="countrySelect"><option value="" disabled selected id="mobile-placeholder"></option></select>
 
  <div class="after-country">
    <label for="declaredValue" id="label-declared">Оціночна вартість (zł)</label>
    <input id="declaredValue" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
  </div>
 
  <div id="addressWrap" class="address-wrap" aria-hidden="true">
    <input type="checkbox" id="addressDelivery" />
    <label for="addressDelivery" id="addressLabel">Адресна доставка</label>
    <input type="checkbox" id="addressPickup" class="ml-16" />
    <label for="addressPickup" id="pickupLabel">Адресний забір</label>
  </div>
 
  <div class="result" aria-live="polite">
    <div class="note" id="formula-row">Формула: <span class="formula">(<span id="f-l">довжина</span> × <span id="f-w">ширина</span> × <span id="f-h">висота</span>) ÷ 4000</span></div>
    <div class="result-row"><strong class="result-label" id="label-volumetric">Об'ємна вага:</strong> <span class="result-value" id="volumetric">—</span> <span class="result-unit" id="unit-kg">kg</span></div>
    <div class="result-row"><strong class="result-label" id="label-billable">Платна вага:</strong> <span class="result-value" id="billable">—</span> <span class="result-unit" id="unit-kg-2">kg</span></div>
    <div class="result-row"><strong class="result-label" id="label-price">Ціна:</strong> <span class="result-value" id="price">—</span> <span class="result-unit" id="unit-currency">zł</span></div>
  </div>
 
  <div id="customsBlock" class="customs" aria-live="polite" style="display:none">
    <strong id="customsText"></strong>
    <div id="customsDetails" class="muted mt-6"></div>
  </div>
 
  <div id="presenceWarning" class="warning" aria-live="polite" style="display:none"></div>
  <div id="weightBlock" class="warning" aria-live="polite" style="display:none"></div>
  <div class="feedback-footer">
  <button class="feedback-btn" id="feedbackBtn" type="button">
    <span id="feedbackBtnLabel">✉ Повідомити про помилку</span>
  </button>
    
  <button class="feedback-btn" id="wakeLockBtn" type="button">
    <span id="wakeLockLabel">🔒 Не давати заснути</span>
  </button>

</div>

<!-- Feedback modal -->
<div class="modal-overlay" id="feedbackModal" role="dialog" aria-modal="true" aria-labelledby="feedbackModalTitle">
  <div class="modal-box">
    <div class="modal-header">
      <p class="modal-title" id="feedbackModalTitle">Зворотній зв'язок</p>
      <button class="modal-close" id="feedbackModalClose" aria-label="Закрити">✕</button>
    </div>
    <div class="modal-type-row">
      <button class="mode-btn active" id="fbTypeBug" data-type="bug">🐛 Помилка</button>
      <button class="mode-btn" id="fbTypeIdea" data-type="idea">💡 Покращення</button>
    </div>
    <textarea id="feedbackText" class="feedback-textarea" placeholder="Опишіть проблему або ідею…" rows="4"></textarea>
    <button class="feedback-submit-btn" id="feedbackSubmit">Надіслати</button>
    <div id="feedbackStatus" class="feedback-status" style="display:none"></div>
  </div>
</div>
</main>
 
<div class="modal-overlay" id="pkgModal" role="dialog" aria-modal="true" aria-labelledby="pkgModalTitle">
  <div class="modal-box">
    <div class="modal-header">
      <p class="modal-title" id="pkgModalTitle">Оберіть пакування</p>
      <button class="modal-close" id="pkgModalClose" aria-label="Закрити">✕</button>
    </div>
    <input class="modal-search" id="pkgSearch" type="search" autocomplete="off" placeholder="Назва або код…">
    <div class="modal-list" id="pkgList"></div>
  </div>
</div>
 
<script src="./script.js"></script>
</body>
</html>
